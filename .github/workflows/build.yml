name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle and Build APK
        run: |
          wget -q https://gradle.org
          unzip -q gradle-8.5-bin.zip -d /opt
          export PATH="/opt/gradle-8.5/bin:$PATH"
          keytool -genkey -v -keystore release.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=GarageDev,O=Dev,C=RU"
          gradle assembleRelease
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:123456 --out CarEvolution-release.apk app-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarEvolution-APK
          path: |
            CarEvolution-release.apk
            release.jks
