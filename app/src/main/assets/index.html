<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Эволюция Тачек: Империя Гаража</title><script src="/sdk.js"></script><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;font-family:sans-serif}body{background:radial-gradient(circle at top,#1e293b,#090d16);color:#fff;height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.hdr{padding:10px;background:rgba(0,0,0,0.65);text-align:center;border-bottom:1px solid rgba(255,255,255,0.1)}.bal{font-size:28px;font-weight:900;color:#fbbf24;text-shadow:0 0 15px rgba(251,191,36,0.4)}.inf{font-size:12px;color:#94a3b8;margin-top:2px}.pbar{width:88%;height:9px;background:rgba(255,255,255,0.12);border-radius:10px;margin:6px auto 0;overflow:hidden}.pfill{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#10b981);transition:width 0.2s}.gar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:8px}.tit{font-size:21px;font-weight:900;margin-bottom:3px;text-shadow:0 2px 8px #000;text-align:center}.era{font-size:11px;color:#34d399;font-weight:bold;letter-spacing:1.5px;margin-bottom:10px}.photo-card{width:285px;height:175px;border-radius:18px;border:3px solid #f59e0b;box-shadow:0 12px 30px rgba(0,0,0,0.85);overflow:hidden;position:relative;cursor:pointer;transition:transform 0.06s;background:#0f172a}.photo-card:active{transform:scale(0.94)}.photo-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.tap-hint{position:absolute;bottom:7px;right:9px;background:rgba(0,0,0,0.75);color:#fbbf24;font-size:10px;font-weight:bold;padding:3px 7px;border-radius:7px}.ctr{padding:10px;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;gap:7px}.btn{padding:11px 14px;border:none;border-radius:12px;font-size:14px;font-weight:bold;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.4)}.btn:disabled{opacity:0.35}.b1{background:linear-gradient(90deg,#ef4444,#b91c1c)}.b2{background:linear-gradient(90deg,#3b82f6,#1d4ed8)}.b3{background:linear-gradient(90deg,#10b981,#047857)}.b4{background:linear-gradient(90deg,#f59e0b,#d97706);color:#111;justify-content:center}.ft{position:absolute;color:#fde047;font-weight:900;font-size:21px;pointer-events:none;text-shadow:0 2px 6px #000;animation:up 0.75s ease-out forwards;z-index:10}@keyframes up{to{opacity:0;transform:translateY(-80px) scale(1.2)}}</style></head><body oncontextmenu="return false"><div class="hdr"><div class="bal"><span id="c">0</span> 💰</div><div class="inf">Клик: +<span id="cp">1</span> | Авто: +<span id="ai">0</span>/с</div><div class="pbar"><div class="pfill" id="pf"></div></div></div><div class="gar"><div class="tit" id="cn"></div><div class="era" id="ce"></div><div class="photo-card" id="cb"><img id="cimg" src="car0.jpg" alt="car"><div class="tap-hint">ЖМИ НА ФОТО!</div></div></div><div class="ctr"><button class="btn b1" id="eb"><span>⬆️ Новая тачка</span><span id="ec"></span></button><button class="btn b2" id="tb"><span>⚡ Тюнинг движка (Ур. <span id="tlvl">1</span>)</span><span id="tc"></span></button><button class="btn b3" id="ab"><span>🔧 СТО / Механик (<span id="mcnt">0</span>)</span><span id="ac"></span></button><button class="btn b4" id="adb">🎬 Нитро x2 + Бонус кэш (Реклама)</button></div><script>
const names=["Ушастый Запорожец","Дедовская Копейка","Боевая Семерка","Нива 4x4 Тайга","БПАН Приора","Веста Спорт","УАЗ Патриот","Солярис на автомате","Киа Рио такси","Поло седан","Шкода Октавия RS","Камри 3.5 на чипе","Хонда Аккорд","Мазда 6","Ниссан ГТР R35","Тойота Супра A80","Субару WRX STI","Лансер Эволюшн","Форд Мустанг GT","Шевроле Камаро","Ауди RS6 Авант","Бэха М3 F80","Бэха М5 Компетишн","Мерс Е63 АМГ","Черный Гелик 63","Порше 911 GT3","Феррари 488","Ламба Авентадор","Макларен 720S","Бугатти Широн"];
const cars=[];let p=1,c=150;for(let i=0;i<30;i++){cars.push({n:names[i],p:p,c:i<29?c:0});p=Math.floor(p*1.75)+2;c=Math.floor(c*2.35)}
function fmt(n){if(n<1e4)return Math.floor(n);if(n<1e6)return(n/1e3).toFixed(1)+'K';if(n<1e9)return(n/1e6).toFixed(2)+'M';if(n<1e12)return(n/1e9).toFixed(2)+'B';if(n<1e15)return(n/1e12).toFixed(2)+'T';return(n/1e15).toFixed(2)+'Qa'}
const actx=new(window.AudioContext||window.webkitAudioContext)();function beep(f,d){try{if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
let s={c:0,l:0,t:1,tc:35,m:0,mc:60},x=1,sdk=null;try{const d=localStorage.getItem('ce_hard30');if(d)s=JSON.parse(d)}catch(e){}function sv(){localStorage.setItem('ce_hard30',JSON.stringify(s))}
function getClick(){return(cars[s.l].p+Math.floor(s.t*(s.l+1)*1.5))*x}
function getAuto(){return s.m*Math.ceil(cars[s.l].p*0.45)*x}
function ui(){const k=cars[s.l];document.getElementById('c').innerText=fmt(s.c);document.getElementById('cp').innerText=fmt(getClick());document.getElementById('ai').innerText=fmt(getAuto());document.getElementById('cn').innerText=k.n;document.getElementById('ce').innerText=`ТАЧКА ${s.l+1} ИЗ 30`;document.getElementById('cimg').src=`car${s.l}.jpg`;document.getElementById('tlvl').innerText=s.t;document.getElementById('mcnt').innerText=s.m;const eb=document.getElementById('eb'),pf=document.getElementById('pf');if(s.l>=29){document.getElementById('ec').innerText="ТОП ГАРАЖ";eb.disabled=true;pf.style.width="100%"}else{document.getElementById('ec').innerText=fmt(k.c)+" 💰";eb.disabled=s.c<k.c;pf.style.width=Math.min(100,(s.c/k.c)*100)+"%"}document.getElementById('tc').innerText=fmt(s.tc)+" 💰";document.getElementById('tb').disabled=s.c<s.tc;document.getElementById('ac').innerText=fmt(s.mc)+" 💰";document.getElementById('ab').disabled=s.c<s.mc}
document.getElementById('cb').onpointerdown=e=>{beep(300+s.l*15,0.06);const g=getClick();s.c+=g;const t=document.createElement('div');t.className='ft';t.innerText='+'+fmt(g)+' 💰';t.style.left=(e.clientX-20)+'px';t.style.top=(e.clientY-30)+'px';document.body.appendChild(t);setTimeout(()=>t.remove(),750);ui()};
document.getElementById('eb').onclick=()=>{if(s.c>=cars[s.l].c&&s.l<29){beep(620,0.22);s.c-=cars[s.l].c;s.l++;sv();ui();if(sdk&&s.l%2===0)sdk.adv.showFullscreenAdv()}};
document.getElementById('tb').onclick=()=>{if(s.c>=s.tc){beep(540,0.12);s.c-=s.tc;s.t++;s.tc=Math.floor(s.tc*1.65);sv();ui()}};
document.getElementById('ab').onclick=()=>{if(s.c>=s.mc){beep(460,0.12);s.c-=s.mc;s.m++;s.mc=Math.floor(s.mc*1.55);sv();ui()}};
function bst(){x=2;s.c+=Math.max(getClick()*35,getAuto()*25);const b=document.getElementById('adb');b.disabled=true;b.innerText="🔥 НИТРО x2 АКТИВНО!";ui();setTimeout(()=>{x=1;b.disabled=false;b.innerText="🎬 Нитро x2 + Бонус кэш (Реклама)";ui()},30000)}
document.getElementById('adb').onclick=()=>{if(window.AndroidAds)window.AndroidAds.showRewarded();else if(sdk)sdk.adv.showRewardedVideo({callbacks:{onRewarded:bst}});else bst()};
setInterval(()=>{if(s.m>0){s.c+=getAuto();ui()}},1000);setInterval(sv,5000);if(typeof YaGames!=='undefined')YaGames.init().then(_s=>{sdk=_s;sdk.features?.LoadingAPI?.ready()}).catch(()=>{});ui();
</script></body></html>
