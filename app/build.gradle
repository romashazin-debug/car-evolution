plugins {
    id 'com.android.application'
}
android {
    namespace 'com.garage.carevo'
    compileSdk 34
    defaultConfig {
        applicationId "com.garage.carevo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file("../release.jks")
            storePassword "123456"
            keyAlias "mykey"
            keyPassword "123456"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
